name: Build Portable Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env from Secrets
        run: |
          "ERPNEXT_URL=${{ secrets.ERPNEXT_URL }}" | Out-File -FilePath .env -Encoding utf8
          "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" | Out-File -FilePath .env -Append -Encoding utf8

      - name: Install dependencies
        run: npm install

      - name: Build Portable EXE
        run: npm run electron:build

      - name: Upload Sekem-Farms-Mapper.exe
        uses: actions/upload-artifact@v4
        with:
          name: Sekem-Farms-Mapper-Portable
          path: release/*.exe
