name: Build Portable Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create .env from Secrets (No BOM)
        shell: pwsh
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $content = "ERPNEXT_URL=${{ secrets.ERPNEXT_URL }}`nVITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}`n"
          [System.IO.File]::WriteAllText("$PWD\.env", $content, $utf8NoBom)

      - name: Install dependencies
        run: bun install

      - name: Build Portable EXE
        run: bun run electron:build

      - name: Upload Sekem-Farms-Mapper.exe
        uses: actions/upload-artifact@v4
        with:
          name: Sekem-Farms-Mapper-Portable
          path: release/*.exe
